[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "patchcraft-accel"
description = "Optional native accelerator for patchcraft (overlap-fold hot path)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Leonardo Marques de Souza" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Homepage = "https://github.com/LeoPR/PatchCraft"
Repository = "https://github.com/LeoPR/PatchCraft"
Issues = "https://github.com/LeoPR/PatchCraft/issues"
Changelog = "https://github.com/LeoPR/PatchCraft/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "pyo3"
features = ["extension-module"]
