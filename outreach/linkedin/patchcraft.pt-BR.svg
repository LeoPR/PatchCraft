<text x="105" y="147" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="rgb(110, 110, 110)">As mesmas três geometrias, agora com o que a biblioteca devolve em cada uma. O reconstruct confere</text>
<text x="105" y="177" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="rgb(110, 110, 110)">a cobertura antes de somar, então a falha chega como erro e não como pixel preto.</text>
