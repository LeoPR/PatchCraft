<text x="129" y="675" font-family="Consolas,Menlo,monospace" font-size="17" fill="rgb(176, 42, 42)">ValueError: patch grid leaves pixels uncovered (partial coverage forbidden):</text>
<text x="129" y="699" font-family="Consolas,Menlo,monospace" font-size="17" fill="rgb(26, 26, 26)">stride=(20, 20) covers (112, 112) of (128, 128).</text>
<text x="129" y="723" font-family="Consolas,Menlo,monospace" font-size="17" fill="rgb(26, 26, 26)">Choose a geometry with exact coverage (see patchcraft.tilings).</text>
<text x="129" y="755" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="rgb(110, 110, 110)">E a resposta vem junto.</text>
<text x="327" y="755" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="rgb(110, 110, 110)">tilings((3, 128, 128)) lista 517 geometrias legais. Com patch 32, os passos que cobrem exato:</text>
<text x="129" y="779" font-family="Consolas,Menlo,monospace" font-size="17" font-weight="bold" fill="rgb(26, 26, 26)">1, 2, 3, 4, 6, 8, 12, 16, 24 e 32.</text>
<text x="105" y="831" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="rgb(110, 110, 110)">Reproduz com: python tools/make_outreach_figure.py</text>
