[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "patchcraft"
description = "Image patch extraction, reconstruction, pairing and seam-aware stitching for super-resolution and dataset pipelines."
readme = "README.pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Leonardo Marques de Souza" }]
keywords = ["image", "patches", "super-resolution", "dataset", "torch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
    "pillow>=10",
]

[project.optional-dependencies]
cache = ["zstandard>=0.22"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    # framework auxiliar (test fixtures, lab/): NOT a runtime dep of patchcraft
    "torchvision>=0.20",
]

[project.urls]
Homepage = "https://github.com/LeoPR/PatchCraft"
Repository = "https://github.com/LeoPR/PatchCraft"
Issues = "https://github.com/LeoPR/PatchCraft/issues"
Changelog = "https://github.com/LeoPR/PatchCraft/blob/main/CHANGELOG.md"
Documentation = "https://github.com/LeoPR/PatchCraft/blob/main/docs/GUIDE.md"

[tool.setuptools.dynamic]
# Read statically from the AST, so importing patchcraft (and torch with it) is
# never part of a build.
version = { attr = "patchcraft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchcraft = ["py.typed"]

# The sdist contents are declared in MANIFEST.in, which must carry `accel/`:
# it is the Rust source the sdist builds from when a toolchain is present.

[tool.cibuildwheel]
# pyo3 is pinned to abi3-py312 and `requires-python` is >=3.12, so one wheel
# per platform covers every supported interpreter. Building only the cp312
# identifier is therefore complete, not a shortcut.
build = "cp312-*"
# musllinux and 32-bit are skipped because torch publishes no wheels for them,
# so a patchcraft wheel there could never be installed alongside its own
# dependency.
skip = "*-musllinux_* *-manylinux_i686 *-win32"
build-frontend = "build"
environment = { PATCHCRAFT_REQUIRE_EXTENSION = "1" }

[tool.cibuildwheel.linux]
# The manylinux container has no Rust; install it once before the builds.
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable"
environment = { PATH = "$HOME/.cargo/bin:$PATH", PATCHCRAFT_REQUIRE_EXTENSION = "1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pip>=26.1.1",
    "setuptools>=82.0.1",
    "setuptools-rust>=1.11",
    "wheel>=0.47.0",
]
