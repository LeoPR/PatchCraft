[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchcraft"
description = "Image patch extraction, reconstruction, pairing and seam-aware stitching for super-resolution and dataset pipelines."
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Leonardo Marques de Souza" }]
keywords = ["image", "patches", "super-resolution", "dataset", "torch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
    "pillow>=10",
]

[project.optional-dependencies]
accel = ["patchcraft-accel>=0.1.0"]
cache = ["zstandard>=0.22"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    # framework auxiliar (test fixtures, lab/): NOT a runtime dep of patchcraft
    "torchvision>=0.20",
]

[project.urls]
Homepage = "https://github.com/LeoPR/PatchCraft"
Repository = "https://github.com/LeoPR/PatchCraft"
Issues = "https://github.com/LeoPR/PatchCraft/issues"
Changelog = "https://github.com/LeoPR/PatchCraft/blob/main/CHANGELOG.md"
Documentation = "https://github.com/LeoPR/PatchCraft/blob/main/docs/GUIDE.md"

[tool.hatch.version]
path = "src/patchcraft/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/patchcraft"]

[tool.hatch.build.targets.wheel.force-include]
"src/patchcraft/py.typed" = "patchcraft/py.typed"

# The sdist is the reproducible source snapshot: product (`src/`) plus the
# track that proves it works (`tests/`, `docs/`). It must NOT carry `lab/`,
# whose contents are gitignored scratch work (`lab/.gitignore` is `*`) and so
# cannot be reproduced from any commit -- patchcraft-0.2.0.tar.gz shipped three
# such files to PyPI. `.vscode/` is machine-local editor config, `accel/`
# is a separate distribution with its own sdist, and `.superpowers/` is
# untracked agent tooling that hatchling would otherwise sweep in.
[tool.hatch.build.targets.sdist]
exclude = [
    "lab/",
    "**/.vscode/**",
    "accel/",
    ".superpowers/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "gpu: requires CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pip>=26.1.1",
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
]

# `patchcraft-accel` is published separately (built from the `accel/` crate by
# the release workflow). The path source lets uv resolve the `accel` extra into
# `uv.lock` before it exists on PyPI; CI syncs with `--locked` and never
# requests the extra, so no Rust build happens outside the accel jobs.
[tool.uv.sources]
patchcraft-accel = { path = "accel" }
