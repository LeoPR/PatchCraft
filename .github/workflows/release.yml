name: release

# Triggered when a version tag is pushed (vX.Y.Z[.aN, .bN, .rcN]).
#
# One PyPI project, two shapes of wheel for the same version:
#   * a native `cp312-abi3-<platform>` wheel per supported platform, carrying
#     the Rust accelerator compiled into `patchcraft/_accel_native`;
#   * one universal `py3-none-any` wheel for every other platform, pure torch.
# Installers prefer the most specific compatible tag, so a user gets the
# accelerator where one exists and a working install everywhere else.
#
# Steps:
#   1. Re-run the test job at the tag ref (sanity check on the exact ref).
#   2. Build the sdist + universal wheel, and the native wheels via
#      cibuildwheel.
#   3. Check the artifact set before anything is uploaded.
#   4. Publish to PyPI via Trusted Publishing (OIDC): no token, no secret.
#   5. Create the GitHub Release page and attach every artifact.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.rc[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    name: re-run tests at tag ref
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
      # The pure path, so this job stays fast and deterministic. Both paths
      # are covered on every push to main by test.yml.
      PATCHCRAFT_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --extra cache --extra dev
      - name: The tag is the version, so check git agrees with it
        # Compared through PEP 440 normalisation, because a tag reads
        # `v0.5.2.rc1` while everything downstream says `0.5.2rc1`.
        run: |
          uv run python - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from check_dist import normalize_version
          import patchcraft

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          scm = patchcraft.__version__
          if normalize_version(tag) != normalize_version(scm):
              print(
                  f"::error::tag implies version {tag!r} but setuptools-scm "
                  f"derived {scm!r}. A dirty tree or a missing tag causes this."
              )
              raise SystemExit(1)
          print(f"tag and setuptools-scm agree on {scm}")
          PY
      - run: uv run ruff check src tests
      - run: uv run mypy --strict src
      - run: uv run pytest -m "not gpu"

  build-pure:
    name: sdist + universal wheel
    runs-on: ubuntu-latest
    needs: validate
    env:
      PATCHCRAFT_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - name: Inspect dist metadata
        run: |
          uv run --with twine twine check dist/*
          uv run python tools/check_dist.py dist --expect-version "${GITHUB_REF_NAME#v}" --require-universal
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pure
          path: dist/

  build-native:
    name: native wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the Intel runner; macos-latest is arm64. It is
          # NOT macos-13, which left the runner table: an unavailable label
          # does not fail, it queues forever, and it queued for 20 minutes
          # while every other cell finished in under one.
          - { os: windows-latest, name: win_amd64, archs: AMD64 }
          - { os: ubuntu-latest, name: manylinux_x86_64, archs: x86_64 }
          - { os: ubuntu-24.04-arm, name: manylinux_aarch64, archs: aarch64 }
          - { os: macos-latest, name: macosx_arm64, archs: arm64 }
          - { os: macos-15-intel, name: macosx_x86_64, archs: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0

      - name: Install Rust
        # cibuildwheel installs its own toolchain inside the manylinux
        # container (see before-all in pyproject.toml); Windows and macOS
        # build on the runner itself and need one here.
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      # Pinned exactly: cibuildwheel publishes v4.2.0 and v4.2 but no bare
      # `v4` alias, so `@v4` is a 404 that fails the job before any step runs.
      - uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Every platform wheel must carry the extension, at the tag version
        # bash explicitly: this job also runs on Windows, where the default
        # shell is PowerShell and ${GITHUB_REF_NAME#v} is not expansion but a
        # literal string.
        shell: bash
        run: python tools/check_dist.py wheelhouse --expect-version "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: wheelhouse/

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    needs: [build-pure, build-native]
    environment:
      name: pypi
      url: https://pypi.org/project/patchcraft/
    permissions:
      id-token: write  # required for OIDC token exchange with PyPI
    steps:
      - uses: actions/checkout@v4  # for tools/check_dist.py only
      - uses: actions/download-artifact@v4
        with:
          pattern: "{dist-pure,native-*}"
          path: dist
          merge-multiple: true
      - name: The full artifact set is what gets published
        run: |
          python tools/check_dist.py dist --expect-version "${GITHUB_REF_NAME#v}" --require-universal
      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A file already on PyPI is a no-op instead of a hard failure.
          # Without this, re-running the pipeline fails here and
          # `github-release` never runs, because it is `needs: publish-pypi`.
          skip-existing: true
        # No `password` field -- OIDC handles authentication.
        # The pypi.org publisher config must match:
        #   PyPI project name: patchcraft
        #   Owner:             LeoPR
        #   Repository:        PatchCraft
        #   Workflow:          release.yml
        #   Environment:       pypi

  github-release:
    name: create GitHub Release with assets
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write  # required to create a Release
    steps:
      - uses: actions/checkout@v4  # for tools/check_dist.py only
      - uses: actions/download-artifact@v4
        with:
          pattern: "{dist-pure,native-*}"
          path: dist
          merge-multiple: true
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Release + attach assets
        uses: softprops/action-gh-release@v2
        with:
          name: "PatchCraft ${{ github.ref_name }}"
          body: |
            See [`CHANGELOG.md`](https://github.com/LeoPR/PatchCraft/blob/main/CHANGELOG.md) for the full notes.

            Install:
            ```
            pip install patchcraft==${{ steps.ver.outputs.version }}
            ```

            The native accelerator ships inside the platform wheels. Other
            platforms install the universal wheel and run the pure-torch
            paths; `patchcraft.accel_available()` reports which one you got.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
