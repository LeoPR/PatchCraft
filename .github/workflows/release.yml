name: release

# A version tag (vX.Y.Z[.aN, .bN, .rcN]) runs everything and publishes. Any
# other trigger is a dry run: the same tests, builds and artifact gates, and
# nothing published, because publish-pypi and github-release run only on a
# tag. A dry run starts by hand (Run workflow), and by itself on a push to main
# or a pull request that changes a packaging file listed below, which is what
# a Dependabot pull request for a release-only action does. Without a tag,
# setuptools-scm gives a development version with a local segment; the dry
# run's gates accept it (check_dist --allow-local), a release's never do.
#
# One PyPI project, two shapes of wheel for the same version:
#   * a native `cp312-abi3-<platform>` wheel per supported platform, carrying
#     the Rust accelerator compiled into `patchcraft/_accel_native`;
#   * one universal `py3-none-any` wheel for every other platform, pure torch.
# Installers prefer the most specific compatible tag, so a user gets the
# accelerator where one exists and a working install everywhere else.
#
# Steps:
#   1. Re-run the test job at the tag ref (sanity check on the exact ref).
#   2. Build the sdist + universal wheel, and the native wheels via
#      cibuildwheel.
#   3. Check the artifact set before anything is uploaded.
#   4. Publish to PyPI via Trusted Publishing (OIDC): no token, no secret.
#   5. Create the GitHub Release page and attach every artifact.
#
# The Linux x86_64 jobs run on ubuntu-24.04 by name, not ubuntu-latest. That
# label moves to Ubuntu 26.04 between 2026-10-19 and 2026-11-19
# (actions/runner-images#14748), and a release should not be the first run on
# a new image, least of all the manylinux build, which runs in Docker on the
# host. test.yml runs the suite on ubuntu-26.04 meanwhile, but nothing there
# runs cibuildwheel or Docker, so its green is not enough: moving these jobs
# is a change of its own, which first shows the manylinux_x86_64 build green
# on ubuntu-26.04 without publishing: a dry run with linux_runner set to
# ubuntu-26.04 does that.
#
# Every action is pinned to an exact version, the PyPI upload to a commit (see
# that step), and .github/dependabot.yml proposes the updates.
# dtolnay/rust-toolchain stays on its branch refs, which choose the toolchain.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[ab][0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.rc[0-9]+"
    # The paths below filter branch pushes only; a tag push always runs.
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - tools/check_dist.py
      - accel/Cargo.toml
      - accel/Cargo.lock
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - tools/check_dist.py
      - accel/Cargo.toml
      - accel/Cargo.lock
  workflow_dispatch:
    inputs:
      linux_runner:
        description: Runner for the Linux x86_64 jobs; ubuntu-26.04 tries that image first
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  validate:
    name: re-run tests at the ref
    runs-on: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
    env:
      UV_PYTHON: "3.13"
      # The pure path, so this job stays fast and deterministic. Both paths
      # are covered on every push to main by test.yml.
      PATCHCRAFT_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0
      # The same pin and settings as test.yml, whose comment gives the reasons.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
          prune-cache: true
      - run: uv python install
      - run: uv sync --locked --extra cache --extra dev
      - name: The tag is the version, so check git agrees with it
        if: github.ref_type == 'tag'
        # Compared through PEP 440 normalisation, because a tag reads
        # `v0.5.2.rc1` while everything downstream says `0.5.2rc1`.
        run: |
          uv run python - <<'PY'
          import os, sys
          sys.path.insert(0, "tools")
          from check_dist import normalize_version
          import patchcraft

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          scm = patchcraft.__version__
          if normalize_version(tag) != normalize_version(scm):
              print(
                  f"::error::tag implies version {tag!r} but setuptools-scm "
                  f"derived {scm!r}. A dirty tree or a missing tag causes this."
              )
              raise SystemExit(1)
          print(f"tag and setuptools-scm agree on {scm}")
          PY
      - run: uv run ruff check src tests tools
      - run: uv run mypy --strict src
      - run: uv run pytest -m "not gpu"

  build-pure:
    name: sdist + universal wheel
    runs-on: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
    needs: validate
    env:
      PATCHCRAFT_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0
      # The same pin as test.yml. No cache: from v10, enable-cache's default,
      # auto, is off on tag pushes.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
      - run: uv build
      - name: Inspect dist metadata
        run: |
          uv run --with twine twine check dist/*
          # On a tag the artifacts must carry its version; on a dry run they
          # carry setuptools-scm's development version, local segment included.
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- --expect-version "${GITHUB_REF_NAME#v}"; else set -- --allow-local; fi
          uv run python tools/check_dist.py dist "$@" --require-universal
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: dist-pure
          path: dist/

  build-native:
    name: native wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the Intel runner; macos-latest is arm64. It is
          # NOT macos-13, which left the runner table: an unavailable label
          # does not fail, it queues forever, and it queued for 20 minutes
          # while every other cell finished in under one.
          - { os: windows-latest, name: win_amd64, archs: AMD64 }
          - { os: "${{ inputs.linux_runner || 'ubuntu-24.04' }}", name: manylinux_x86_64, archs: x86_64 }
          - { os: ubuntu-24.04-arm, name: manylinux_aarch64, archs: aarch64 }
          - { os: macos-latest, name: macosx_arm64, archs: arm64 }
          - { os: macos-15-intel, name: macosx_x86_64, archs: x86_64 }
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm derives the version from the tag. A shallow
          # checkout hides it and the fallback is a silent 0.1.dev1.
          fetch-depth: 0

      - name: Install Rust
        # cibuildwheel installs its own toolchain inside the manylinux
        # container (see before-all in pyproject.toml); Windows and macOS
        # build on the runner itself and need one here.
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      # Pinned exactly: cibuildwheel publishes v4.2.0 and v4.2 but no bare
      # `v4` alias, so `@v4` is a 404 that fails the job before any step runs.
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Every platform wheel must carry the extension, at the version built
        # bash explicitly: this job also runs on Windows, where the default
        # shell is PowerShell and ${GITHUB_REF_NAME#v} is not expansion but a
        # literal string. The version rule is build-pure's.
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then set -- --expect-version "${GITHUB_REF_NAME#v}"; else set -- --allow-local; fi
          python tools/check_dist.py wheelhouse "$@"

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: native-${{ matrix.name }}
          path: wheelhouse/

  dry-run-gate:
    # On a run without a tag, what publish-pypi checks before it uploads: the
    # full set, downloaded the way publish-pypi downloads it. Nothing more.
    name: dry run, the full artifact set (nothing is published)
    if: github.ref_type != 'tag'
    runs-on: ${{ inputs.linux_runner || 'ubuntu-24.04' }}
    needs: [build-pure, build-native]
    steps:
      - uses: actions/checkout@v5.1.0  # for tools/check_dist.py only
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: "{dist-pure,native-*}"
          path: dist
          merge-multiple: true
      - name: The full artifact set, as publish-pypi checks it
        run: python tools/check_dist.py dist --allow-local --require-universal

  publish-pypi:
    name: publish to PyPI (Trusted Publishing)
    # Only a tag publishes; every other trigger is a dry run.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: [build-pure, build-native]
    environment:
      name: pypi
      url: https://pypi.org/project/patchcraft/
    permissions:
      id-token: write  # required for OIDC token exchange with PyPI
    steps:
      - uses: actions/checkout@v5.1.0  # for tools/check_dist.py only
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: "{dist-pure,native-*}"
          path: dist
          merge-multiple: true
      - name: The full artifact set is what gets published
        run: |
          python tools/check_dist.py dist --expect-version "${GITHUB_REF_NAME#v}" --require-universal
      - name: Publish via Trusted Publishing
        # Pinned to a commit, with its version alongside for Dependabot. This
        # action runs the upload in the image tagged with its ref, and the
        # commit's image is the build of release/v1 that has published every
        # release through Trusted Publishing; the tag v1.14.2 names a separate
        # build of the same commit.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # A file already on PyPI is a no-op instead of a hard failure.
          # Without this, re-running the pipeline fails here and
          # `github-release` never runs, because it is `needs: publish-pypi`.
          skip-existing: true
        # No `password` field -- OIDC handles authentication.
        # The pypi.org publisher config must match:
        #   PyPI project name: patchcraft
        #   Owner:             LeoPR
        #   Repository:        PatchCraft
        #   Workflow:          release.yml
        #   Environment:       pypi

  github-release:
    name: create GitHub Release with assets
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: publish-pypi
    permissions:
      contents: write  # required to create a Release
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: "{dist-pure,native-*}"
          path: dist
          merge-multiple: true
      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create Release + attach assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: "PatchCraft ${{ github.ref_name }}"
          body: |
            See [`CHANGELOG.md`](https://github.com/LeoPR/PatchCraft/blob/main/CHANGELOG.md) for the full notes.

            Install:
            ```
            pip install patchcraft==${{ steps.ver.outputs.version }}
            ```

            The native accelerator ships inside the platform wheels. Other
            platforms install the universal wheel and run the pure-torch
            paths; `patchcraft.accel_available()` reports which one you got.
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
