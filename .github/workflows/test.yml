name: test

# Every action is pinned to an exact version, and .github/dependabot.yml
# proposes the updates. dtolnay/rust-toolchain stays on its branch refs,
# which are its documented usage and choose the toolchain.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ubuntu-latest moves from Ubuntu 24.04 to 26.04 between 2026-10-19 and
  # 2026-11-19 (actions/runner-images#14748), and while it moves a job on that
  # label can land on either image. The ubuntu-26.04 entries below run the
  # suite on the new image by name, on both paths and at the floor, so a
  # difference shows here before the label moves. Once the move is over they
  # repeat ubuntu-latest, and they go. release.yml stays on ubuntu-24.04;
  # moving it is a separate change (see the comment at its top).
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - { os: ubuntu-26.04, python: "3.14" }
    env:
      # Force uv to use the matrix Python in every uv* invocation
      # (otherwise `uv run` re-resolves to its default, which is the
      # newest installed interpreter -- masking the matrix and leaking
      # the dev deps installed under a different version).
      UV_PYTHON: ${{ matrix.python }}
      # This job is the PURE path. Runners ship a Rust toolchain, so without
      # this the editable install would build the extension and these cells
      # would silently stop covering the fallback that most platforms get.
      PATCHCRAFT_PURE_PYTHON: "1"
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm needs the tags to derive a version.
          fetch-depth: 0

      - name: Install uv
        # An exact tag: since v8, setup-uv publishes no major tags, and its
        # releases are immutable. From v10.1.0 it checks the uv binary against
        # a known sha256, which v7 skipped for every uv newer than 0.10.10.
        # version: latest-known installs the newest uv in this release's own
        # checksum table, so uv moves only when this pin does, and never on the
        # day it comes out. prune-cache: true keeps the
        # cache as v7 saved it: v9 stopped pruning by default, and unpruned a
        # Linux key would hold about 3 GB of torch and CUDA wheels, against
        # GitHub's 10 GB per repository.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
          prune-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install

      - name: Install project with dev + cache extras
        # --locked: fail if uv.lock is stale or absent rather than silently
        # re-resolving, so the committed lock is what CI actually validates.
        run: uv sync --locked --extra cache --extra dev

      - name: Ruff
        run: uv run ruff check src tests tools

      - name: Mypy (strict, src only)
        run: uv run mypy --strict src

      - name: The pure path is what is under test here
        run: uv run python -c "import patchcraft; assert not patchcraft.accel_available()"

      - name: Pytest (skip GPU markers)
        run: uv run pytest -m "not gpu"

  test-accel:
    name: ${{ matrix.os }} / py3.12 / accel
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      # A Rust failure must fail this job rather than degrade to the pure
      # path, which would make the job pass while testing nothing new.
      PATCHCRAFT_REQUIRE_EXTENSION: "1"
    strategy:
      fail-fast: false
      matrix:
        # macos-latest (arm64) and ubuntu-24.04-arm are the runners release.yml
        # builds those two wheels on, so the kernel they ship runs the whole
        # suite on its own platform here. The macOS x86_64 wheel cannot: torch
        # has published no macOS x86_64 wheel since 2.3.0, below the floor.
        os: [ubuntu-latest, windows-latest, ubuntu-26.04, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm needs the tags to derive a version.
          fetch-depth: 0

      - name: Install uv
        # The same pin and settings as the test job, for the same reasons.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          enable-cache: true
          prune-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install

      - name: Install project with dev + cache extras
        # setuptools-rust compiles `accel/` into the editable install here,
        # because PATCHCRAFT_PURE_PYTHON is not set for this job.
        run: uv sync --locked --extra cache --extra dev

      - name: Rust unit tests
        # The venv's interpreter on PATH lets the pyo3 build script resolve
        # libpython (extension-module is off outside a wheel build).
        run: uv run cargo test --manifest-path accel/Cargo.toml

      - name: Accelerator is detected
        run: uv run python -c "import patchcraft; assert patchcraft.accel_available()"

      - name: Pytest (accelerated mode)
        run: uv run pytest -m "not gpu"

  test-floor:
    # The declared floor, exercised. pyproject.toml accepts Python 3.12,
    # torch 2.6, numpy 1.26 and pillow 10, and Cargo.toml accepts Rust 1.82;
    # the jobs above test the locked, newest versions, so without this one the
    # floor would only be a claim. Pillow 10.1 is the first 10.x with Python
    # 3.12 wheels. The versions are pinned here, outside uv.lock, on purpose.
    name: ${{ matrix.os }} / py3.12 / floor (torch 2.6, numpy 1.26, pillow 10.1, Rust 1.82)
    runs-on: ${{ matrix.os }}
    env:
      PATCHCRAFT_REQUIRE_EXTENSION: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # setuptools-scm needs the tags to derive a version.
          fetch-depth: 0

      - name: Install uv
        # The same pin as the test job. enable-cache keeps its default, auto,
        # which caches on push and pull_request, so the cache is pruned here too.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest-known
          prune-cache: true

      - name: Install Rust at the declared minimum
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Floor environment
        run: |
          uv venv --python 3.12
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0" "torchvision==0.21.0"
          uv pip install "numpy==1.26.0" "pillow==10.1.0" "pytest>=8" "zstandard>=0.22"
          uv pip install --no-deps -e .

      - name: Accelerator is built with the minimum Rust
        run: .venv/bin/python -c "import patchcraft; assert patchcraft.accel_available()"

      - name: Pytest at the floor, accelerated
        run: .venv/bin/python -m pytest -m "not gpu"

      - name: Pytest at the floor, pure torch
        env:
          PATCHCRAFT_ACCEL: "0"
        run: .venv/bin/python -m pytest -m "not gpu"
