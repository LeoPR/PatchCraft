name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    env:
      # Force uv to use the matrix Python in every uv* invocation
      # (otherwise `uv run` re-resolves to its default, which is the
      # newest installed interpreter -- masking the matrix and leaking
      # the dev deps installed under a different version).
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install

      - name: Install project with dev + cache extras
        # --locked: fail if uv.lock is stale or absent rather than silently
        # re-resolving, so the committed lock is what CI actually validates.
        run: uv sync --locked --extra cache --extra dev

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy (strict, src only)
        run: uv run mypy --strict src

      - name: Pytest (skip GPU markers)
        run: uv run pytest -m "not gpu"

  test-accel:
    name: ${{ matrix.os }} / py3.12 / accel
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        run: uv python install

      - name: Install project with dev + cache extras
        run: uv sync --locked --extra cache --extra dev

      - name: Rust unit tests
        # The venv's interpreter on PATH lets the pyo3 build script resolve
        # libpython (extension-module is off outside maturin builds).
        run: uv run cargo test --manifest-path accel/Cargo.toml

      - name: Build + install the accelerator
        run: |
          uv pip install maturin
          uv run maturin develop --manifest-path accel/Cargo.toml --release

      - name: Accelerator is detected
        run: uv run python -c "import patchcraft; assert patchcraft.accel_available()"

      - name: Pytest (accelerated mode)
        run: uv run pytest -m "not gpu"
