# Dependabot proposes updates to the GitHub Actions that the two workflows use.
# Every action there is pinned to an exact version (the PyPI upload to a
# commit), so CI changes only when one of these pull requests is merged.
# dtolnay/rust-toolchain stays on its branch refs, which choose the toolchain,
# and Dependabot does not track branch refs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /  # for actions, "/" means every workflow in .github/workflows
    schedule:
      interval: monthly  # on the 1st of each month
    cooldown:
      # Nothing younger than two weeks. The age is the tag's git date, which
      # can be earlier than the release, so check the release page in each
      # pull request.
      default-days: 14
    ignore:
      # Majors reviewed on 2026-10-11 and declined, because none fixes
      # anything this repository uses (see CHANGELOG.md). A later major is
      # still proposed.
      - dependency-name: actions/checkout
        versions: [">= 6, < 8"]
      - dependency-name: actions/upload-artifact
        versions: [">= 7, < 8"]
      - dependency-name: actions/download-artifact
        versions: [">= 8, < 9"]
    groups:
      # test.yml runs these, so the pull request's own CI exercises them. A
      # setup-uv bump also moves uv (version: latest-known), and CI does not
      # run the release's uv build, so run that locally before merging.
      tested-by-ci:
        patterns:
          - actions/checkout
          - astral-sh/setup-uv
        update-types: [minor, patch]
      # Only release.yml runs these, on a tag push, so a green CI on the pull
      # request says nothing about them.
      release-only:
        patterns:
          - actions/upload-artifact
          - actions/download-artifact
          - pypa/cibuildwheel
          - pypa/gh-action-pypi-publish
          - softprops/action-gh-release
        update-types: [minor, patch]
      # A new major leaves its group and arrives as a pull request of its own:
      # adopt it for a real gain, or close it with "@dependabot ignore this
      # major version", which records the decision.
    commit-message:
      prefix: ci  # Dependabot adds the colon: "ci: bump ..."
